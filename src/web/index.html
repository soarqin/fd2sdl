<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>炎龙骑士团 2 · Web</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; }
        main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }
        h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 0.75rem; }
        p { line-height: 1.5; }
        #status { white-space: pre-wrap; overflow-wrap: anywhere; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, button { font: inherit; max-width: 100%; }
        button { padding: 0.35rem 0.75rem; }
        canvas { max-width: 100%; height: auto; background: black; image-rendering: pixelated; }
    </style>
    <script defer src="./zip-core.min.js"></script>
    <script type="module" src="./game.mjs"></script>
</head>
<body>
    <main>
        <h1>炎龙骑士团 2：黄金城传说</h1>
        <div id="setup">
            <label for="game-zip">选择原版游戏数据 ZIP</label>
            <input id="game-zip" type="file" accept=".zip,application/zip" aria-describedby="zip-help" disabled>
            <p id="zip-help">将原版数据放在 ZIP 根目录或同一子目录。ZIP 仅在当前浏览器中读取。</p>
            <button id="start" type="button" disabled>开始游戏</button>
        </div>
        <p id="status" role="status">正在加载游戏程序……请通过 HTTP 或 HTTPS 打开本页。</p>
        <p id="save-warning" role="alert" hidden>浏览器存档不可用。本次存档仅在当前页面保留。</p>
        <canvas id="canvas" tabindex="0" aria-label="游戏画面" hidden></canvas>
        <button id="reload" type="button" hidden>返回 ZIP 选择</button>
        <noscript><p>请启用 JavaScript 后刷新页面。</p></noscript>
        <p><a href="./THIRD_PARTY_NOTICES.md">许可与第三方声明</a></p>
    </main>
</body>
</html>
